# Include within nginx's http context, e.g. sites-enabled on Ubuntu.
# Replace the hostname and use your actual TLS certificate paths.
limit_req_zone $binary_remote_addr zone=overlay_google_login:1m rate=6r/m;

server {
    listen 443 ssl;
    server_name app.example.com;
    ssl_certificate /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    client_max_body_size 64k;

    # OAuth callback URLs contain one-use codes; do not log request URLs.
    access_log off;

    location = /auth/start {
        limit_req zone=overlay_google_login burst=3 nodelay;
        limit_req_status 429;
        proxy_set_header Host $http_host;
        proxy_pass http://127.0.0.1:4280;
    }
    location / {
        proxy_set_header Host $http_host;
        proxy_pass http://127.0.0.1:4280;
    }
}
