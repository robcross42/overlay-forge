[package]
name = "overlay-forge-server"
version = "1.2.0"
edition = "2021"
publish = false

[dependencies]
overlay-forge-chatgpt-connection = { path = "../crates/chatgpt-connection" }
axum = "0.8.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
rand = "0.9"
base64 = "0.22"
sha2 = "0.10"
subtle = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1.8", features = ["derive"] }
overlay-forge-media = { path = "../modules/media/src-tauri", default-features = false }
overlay-forge-google-identity = { path = "../crates/google-identity" }
