[package]
name = "overlay-forge"
version = "1.0.4"
description = "Private launcher for Overlay Forge products."
authors = ["Overlay Forge"]
edition = "2021"

[lib]
name = "overlay_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
overlay-forge-google-identity = { path = "../crates/google-identity" }
overlay-forge-media = { path = "../modules/media/src-tauri", default-features = false, features = ["desktop"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.9.0", features = ["protocol-asset", "tray-icon"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-global-shortcut = "2.3.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
png = "0.18.1"
base64 = "0.22"
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Security_Cryptography"] }
tauri-plugin-dialog = "2.7.1"
flate2 = "1.1.9"
bson = "3.1.0"
jsonwebtoken = "9.3.1"
sha2 = "0.10.9"
rand = "0.9.4"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1.8", features = ["derive"] }

tauri-plugin-single-instance = "=2.4.4"

[target.'cfg(target_os = "linux")'.dependencies]
aes-gcm = { version = "=0.10.3", features = ["std"] }
secret-service = { version = "=5.2.0", features = ["rt-async-io-crypto-rust"] }

[dev-dependencies]
aes-gcm = { version = "=0.10.3", features = ["std"] }
